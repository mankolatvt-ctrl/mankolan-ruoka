name: Päivitä Mankolan koulun ruoka

on:
  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-food:
    runs-on: ubuntu-latest

    steps:

      - name: Hae repository
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Asenna riippuvuudet
        run: |
          pip install -r requirements.txt

      - name: Hae päivän ruoka
        run: |
          python paivita_ruoka.py

      - name: Tallenna uusi ruoka
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ruoka.xml

          git diff --cached --quiet || git commit -m "Päivitä päivän ruoka"

          git push
